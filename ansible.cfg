# ┌──────────────────────────────────────────────┐
# │ arpa-iac - Ansible Configuration             │
# │ Defaults for the ansible-playbook CLI when   │
# │ run from the repo root.                      │
# └──────────────────────────────────────────────┘

[defaults]

# Roles live in ./roles — import as `- role: base`
roles_path = ./roles

# Inventory directory; every inventory file lives under ./inventories/
inventory = inventories/

# Verify host keys against ~/.ssh/known_hosts.
# ansible-baseline disables this and flags the MITM risk in its own comment.
# This repo targets real hosts, so honour that warning — every lab host is
# already in known_hosts via the portal-22 aliases.
host_key_checking = True

# No .retry files cluttering the repo root
retry_files_enabled = False

# Fail fast on unreachable hosts instead of hanging
timeout = 10

# Readable play output. Not `stdout_callback = yaml` — that named
# community.general.yaml, removed in community.general 12.0.0, and on a current
# ansible-core every playbook aborted before running a task. ansible-core 2.13+
# gives the same output through this option on the built-in default callback.
result_format = yaml

# Suppress the interpreter-discovery warning; targets are a mix of
# Debian 13, Ubuntu 26.04, RHEL 10, Rocky 9 and Alpine 3.24
interpreter_python = auto_silent

# Show a per-task timing summary — useful for spotting a role that got slow
callbacks_enabled = profile_tasks


[privilege_escalation]

# Every host requires a sudo password; become passwords come from the vault,
# never from NOPASSWD sudoers rules. See group_vars/all/vars.yml.
become = False
become_method = sudo


[ssh_connection]

# Reuse the ControlMaster sockets already configured in ~/.ssh/config
ssh_args = -o ControlMaster=auto -o ControlPersist=10m

# Faster file transfer than the default scp fallback
pipelining = True
