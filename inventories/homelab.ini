# ┌───────────────────────────────────────────────────────────────┐
# │ arpa-iac - Homelab Inventory                                  │
# │ Hostnames match the portal-22 aliases in ~/.ssh/config.local, │
# │ so SSH supplies the IdentityFile. ansible_user is set anyway  │
# │ so the inventory is self-documenting.                         │
# └───────────────────────────────────────────────────────────────┘

# ──[ Raspberry Pis — DNS/DHCP, VPN, NAS ]────────────────────────────────────
[pis]
netrunner    ansible_user=arpatek
edgerunner   ansible_user=sysadmin

# ──[ Hypervisor ]────────────────────────────────────────────────────────────
[proxmox]
blackwall    ansible_user=sysadmin

# ──[ Identity — handle last, an IPA server breaks badly ]────────────────────
[ipa_server]
mikoshi      ansible_user=sysadmin

# ──[ Lab VMs on blackwall — load-bearing ]───────────────────────────────────
[vms]
soulkiller   ansible_user=arpatek
netwatch     ansible_user=arpatek
erebus       ansible_user=arpatek
sandevistan  ansible_user=arpatek
kerenzikov   ansible_user=arpatek

# ──[ Scratch — reprovisioned on demand, never load-bearing ]─────────────────
# errata is the only spare slot on blackwall and gets rebuilt as needed. It is
# deliberately outside [prod]: a drift check against prod should not go red
# because a disposable VM was rebuilt this morning.
#
# Its host key changes on every reprovision — `ssh-keygen -R errata` before
# reconnecting, since host_key_checking is on.
[scratch]
errata       ansible_user=student

[k3s]
erebus
sandevistan
kerenzikov

# ──[ Practice VMs — UTM, disposable, snapshot-reverted ]─────────────────────
# glados and tars sit on darwin's UTM *shared* network (192.168.64.0/24) and
# are reachable only from darwin. That is fine — darwin is the control node.
[practice]
glados       ansible_user=sysadmin
tars         ansible_user=sysadmin
gort         ansible_user=sysadmin
talos        ansible_user=sysadmin
# Ubuntu 25.10+ points /usr/bin/sudo at sudo-rs via alternatives, and Ansible's
# become plugin times out waiting for its escalation prompt. Classic sudo is
# still installed at /usr/bin/sudo.ws — use it directly rather than switching
# the system alternative, which would change behaviour for interactive use too.
clank        ansible_user=sysadmin ansible_become_exe=/usr/bin/sudo.ws
hal          ansible_user=sysadmin ansible_become_method=doas

# ──[ Credential scopes ]─────────────────────────────────────────────────────
# Where `become` credentials are resolved from — orthogonal to what a host does,
# which is why these groups overlap the functional ones.
#
#   inventories/group_vars/<group>/vault.yml   members of that group
#   inventories/host_vars/<host>/vault.yml     that host alone
#
# These live beside the inventory, not at the repo root. ansible-playbook looks
# for group_vars adjacent to the playbook and adjacent to the inventory — never
# in the current directory. At the repo root they were found by ad-hoc `ansible`
# (which uses the cwd) and silently ignored by every playbook, so become failed
# with "Missing sudo password" while the variable looked correctly defined.
#
# There is deliberately NO group_vars/all/vault.yml. A global default would be
# silently wrong for most hosts; with none, an unconfigured host fails loudly
# on an undefined variable instead of sending the wrong credential.

# Hosts administered through the IPA account `arpatek`. mikoshi is IPA-enrolled
# but logs in as local `sysadmin`, so it is deliberately not here — it is the
# IPA server, not a client.
[ipa_login]
netrunner
soulkiller
netwatch
erebus
sandevistan
kerenzikov

# RHEL 10 practice VMs, built from a common base image. Overlaps [practice] and
# [rhel] on purpose: those groups target disposability and OS family, this one
# targets credential scope.
[rhcsa]
glados
tars
gort

# ──[ Rollups ]───────────────────────────────────────────────────────────────
# Anything load-bearing. If it goes down, something breaks.
[prod:children]
pis
proxmox
ipa_server
vms

# RHEL-family targets — RHCSA-accurate drill surface
[rhel]
gort
glados
tars
errata
